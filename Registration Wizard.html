<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SaaS Registration Wizard</title>
  
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #e0e7ff;
      --background: #f9fafb;
      --surface: #ffffff;
      --text-main: #111827;
      --text-muted: #6b7280;
      --border: #d1d5db;
      --error: #ef4444;
      --error-light: #fef2f2;
      --success: #10b981;
      --radius: 12px;
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--background);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .wizard-container {
      background-color: var(--surface);
      width: 100%;
      max-width: 500px;
      border-radius: var(--radius);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      padding: 2.5rem;
      position: relative;
      overflow: hidden;
    }

    .header {
      margin-bottom: 2rem;
      text-align: center;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    /* Progress Bar */
    .progress-container {
      margin-bottom: 2rem;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background-color: #e5e7eb;
      border-radius: 9999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background-color: var(--primary);
      border-radius: 9999px;
      transition: width 0.4s ease;
    }

    /* Form Styles */
    .step-content {
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .form-group {
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: var(--text-main);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      transition: all 0.2s ease;
      background-color: var(--surface);
    }

    .input-wrapper input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .input-wrapper input.has-error {
      border-color: var(--error);
      background-color: var(--error-light);
    }
    
    .input-wrapper input.has-error:focus {
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
    }

    .error-msg {
      color: var(--error);
      font-size: 0.8rem;
      margin-top: 0.375rem;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .toggle-password {
      position: absolute;
      right: 1rem;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.25rem;
    }

    .toggle-password:hover {
      color: var(--text-main);
    }

    /* Buttons */
    .actions {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
    }

    .btn {
      flex: 1;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn-primary:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .btn-secondary {
      background-color: #f3f4f6;
      color: var(--text-main);
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: #e5e7eb;
    }

    /* Review Step */
    .review-list {
      background-color: #f9fafb;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .review-item {
      display: flex;
      justify-content: space-between;
      padding-block: 0.75rem;
      border-bottom: 1px solid #e5e7eb;
    }

    .review-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .review-label {
      color: var(--text-muted);
      font-size: 0.875rem;
      font-weight: 500;
    }

    .review-value {
      font-weight: 600;
      font-size: 0.875rem;
    }

    .security-notice {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* Success Step */
    .success-container {
      text-align: center;
      padding: 2rem 0;
      animation: fadeIn 0.5s ease;
    }

    .success-icon {
      width: 64px;
      height: 64px;
      background-color: #d1fae5;
      color: var(--success);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }

    .success-icon svg {
      width: 32px;
      height: 32px;
    }

    .success-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .success-desc {
      color: var(--text-muted);
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .wizard-container {
        padding: 1.5rem;
        border-radius: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      body {
        padding: 0;
      }
    }
  </style>

  <!-- Babel to transform JSX in the browser -->
  <script src="https://unpkg.com/@babel/standalone@7.24.4/babel.min.js"></script>
</head>
<body>

  <!-- Root for React to mount -->
  <div id="root">
    <div style="display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: var(--font-family); color: var(--text-muted);">
      Loading Registration Wizard... (Please ensure you have internet access)
    </div>
  </div>

  <!-- We use type="text/babel" to transpile JSX, and data-type="module" to enable import/export syntax natively -->
  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'https://esm.sh/react@18.2.0';
    import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client?deps=react@18.2.0';
    import { useForm } from 'https://esm.sh/react-hook-form@7.51.3?deps=react@18.2.0';
    import { z } from 'https://esm.sh/zod@3.22.4';
    import { zodResolver } from 'https://esm.sh/@hookform/resolvers@3.3.4/zod?deps=react@18.2.0,react-hook-form@7.51.3,zod@3.22.4';

    // SVG Icons
    const EyeIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
        <circle cx="12" cy="12" r="3" />
      </svg>
    );

    const EyeOffIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
        <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
        <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
        <line x1="2" y1="2" x2="22" y2="22" />
      </svg>
    );

    const AlertCircleIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    );

    const CheckIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    );

    /* 
     * PHASE 3: Zod Schema Definition 
     * Reusable schema defining validation rules for the entire form.
     */
    const formSchema = z.object({
      firstName: z.string().min(1, "First name is required"),
      lastName: z.string().min(1, "Last name is required"),
      dob: z.string().min(1, "Date of birth is required").refine((val) => {
        if (!val) return false;
        const inputDate = new Date(val);
        const today = new Date();
        today.setHours(0, 0, 0, 0); // Normalize time to compare only dates
        return inputDate <= today;
      }, "Date of birth cannot be in the future"),
      email: z.string()
        .min(1, "Email is required")
        .includes("@", { message: "Email must contain an '@' symbol" })
        .email("Invalid email format"),
      password: z.string()
        .min(8, "Password must be at least 8 characters long"),
      confirmPassword: z.string()
        .min(1, "Please confirm your password")
    }).refine((data) => data.password === data.confirmPassword, {
      message: "Passwords do not match",
      path: ["confirmPassword"],
    });

    // Helper Input component to reduce boilerplate
    const InputField = ({ label, type, id, register, error, rightIcon, onRightIconClick, placeholder }) => {
      return (
        <div className="form-group">
          <label htmlFor={id}>{label}</label>
          <div className="input-wrapper">
            <input
              type={type}
              id={id}
              placeholder={placeholder}
              className={error ? 'has-error' : ''}
              {...register(id)}
            />
            {rightIcon && (
              <button 
                type="button" 
                className="toggle-password" 
                onClick={onRightIconClick}
                aria-label={type === 'password' ? 'Show password' : 'Hide password'}
              >
                {rightIcon}
              </button>
            )}
          </div>
          {error && (
            <span className="error-msg">
              <AlertCircleIcon /> {error.message}
            </span>
          )}
        </div>
      );
    };

    const WizardApp = () => {
      // Setup phase state (Step 1, 2, 3) and Success state
      const [currentStep, setCurrentStep] = useState(1);
      const [isSuccess, setIsSuccess] = useState(false);
      
      // UI States for password visibility
      const [showPassword, setShowPassword] = useState(false);
      const [showConfirmPassword, setShowConfirmPassword] = useState(false);

      // React Hook Form Initialization
      // mode: 'onChange' gives us real-time validation (Phase 2 requirement)
      const {
        register,
        handleSubmit,
        trigger,
        watch,
        reset,
        formState: { errors }
      } = useForm({
        resolver: zodResolver(formSchema),
        mode: 'onChange',
        defaultValues: {
          firstName: '',
          lastName: '',
          dob: '',
          email: '',
          password: '',
          confirmPassword: ''
        }
      });

      // Watch all values to determine if the NEXT button should be enabled
      const values = watch();
      
      // Helper to check if current step is fully valid to enable the "Next" button
      const isStepValid = () => {
        if (currentStep === 1) {
          const hasValues = !!(values.firstName && values.lastName && values.dob);
          const hasErrors = !!(errors.firstName || errors.lastName || errors.dob);
          return hasValues && !hasErrors;
        }
        if (currentStep === 2) {
          const hasValues = !!(values.email && values.password && values.confirmPassword);
          const hasErrors = !!(errors.email || errors.password || errors.confirmPassword);
          return hasValues && !hasErrors;
        }
        return true;
      };

      const handleNext = async () => {
        let fieldsToValidate = [];
        if (currentStep === 1) fieldsToValidate = ['firstName', 'lastName', 'dob'];
        if (currentStep === 2) fieldsToValidate = ['email', 'password', 'confirmPassword'];

        // Trigger strict validation on specific fields before advancing
        const isStepValid = await trigger(fieldsToValidate);
        if (isStepValid) {
          setCurrentStep((prev) => prev + 1);
        }
      };

      const handleBack = () => {
        setCurrentStep((prev) => prev - 1);
      };

      const onSubmit = (data) => {
        // Phase 1: Output Final Payload
        console.log("====================================");
        console.log("FINAL REGISTRATION PAYLOAD");
        console.log("====================================");
        console.log(JSON.stringify(data, null, 2));
        console.log("====================================");
        
        setIsSuccess(true);
      };

      const handleStartAgain = () => {
        reset();
        setCurrentStep(1);
        setIsSuccess(false);
        setShowPassword(false);
        setShowConfirmPassword(false);
      };

      // Titles for the UI
      const stepTitles = {
        1: "Personal Information",
        2: "Account Details",
        3: "Review & Submit"
      };

      if (isSuccess) {
        return (
          <div className="wizard-container">
            <div className="success-container">
              <div className="success-icon">
                <CheckIcon />
              </div>
              <h1 className="success-title">Registration Complete</h1>
              <p className="success-desc">
                Your account has been successfully created. Check the developer console to view the submitted payload.
              </p>
              <button className="btn btn-primary" onClick={handleStartAgain} style={{ width: '100%' }}>
                Start Again
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="wizard-container">
          {/* Header & Progress Indicator */}
          <div className="header">
            <h1>{stepTitles[currentStep]}</h1>
            <p>Please fill in the details below</p>
          </div>

          <div className="progress-container">
            <div className="progress-header">
              <span>Step {currentStep} of 3</span>
              <span>{Math.round((currentStep / 3) * 100)}%</span>
            </div>
            <div className="progress-track">
              <div 
                className="progress-fill" 
                style={{ width: `${(currentStep / 3) * 100}%` }}
              ></div>
            </div>
          </div>

          {/* Persistent Form Wrapper */}
          <form onSubmit={handleSubmit(onSubmit)}>
            
            {/* STEP 1: Personal Information */}
            {currentStep === 1 && (
              <div className="step-content">
                <InputField 
                  label="First Name" 
                  id="firstName" 
                  type="text" 
                  placeholder="e.g. Jane"
                  register={register} 
                  error={errors.firstName} 
                />
                <InputField 
                  label="Last Name" 
                  id="lastName" 
                  type="text" 
                  placeholder="e.g. Doe"
                  register={register} 
                  error={errors.lastName} 
                />
                <InputField 
                  label="Date of Birth" 
                  id="dob" 
                  type="date" 
                  register={register} 
                  error={errors.dob} 
                />
              </div>
            )}

            {/* STEP 2: Account Details */}
            {currentStep === 2 && (
              <div className="step-content">
                <InputField 
                  label="Email Address" 
                  id="email" 
                  type="email" 
                  placeholder="jane.doe@example.com"
                  register={register} 
                  error={errors.email} 
                />
                <InputField 
                  label="Password" 
                  id="password" 
                  type={showPassword ? "text" : "password"} 
                  placeholder="Minimum 8 characters"
                  register={register} 
                  error={errors.password} 
                  rightIcon={showPassword ? <EyeOffIcon /> : <EyeIcon />}
                  onRightIconClick={() => setShowPassword(!showPassword)}
                />
                <InputField 
                  label="Confirm Password" 
                  id="confirmPassword" 
                  type={showConfirmPassword ? "text" : "password"} 
                  placeholder="Must match password exactly"
                  register={register} 
                  error={errors.confirmPassword}
                  rightIcon={showConfirmPassword ? <EyeOffIcon /> : <EyeIcon />}
                  onRightIconClick={() => setShowConfirmPassword(!showConfirmPassword)}
                />
              </div>
            )}

            {/* STEP 3: Review */}
            {currentStep === 3 && (
              <div className="step-content">
                <div className="review-list">
                  <div className="review-item">
                    <span className="review-label">Name</span>
                    <span className="review-value">{values.firstName} {values.lastName}</span>
                  </div>
                  <div className="review-item">
                    <span className="review-label">Date of Birth</span>
                    <span className="review-value">{values.dob}</span>
                  </div>
                  <div className="review-item">
                    <span className="review-label">Email</span>
                    <span className="review-value">{values.email}</span>
                  </div>
                  <div className="review-item">
                    <span className="review-label">Password</span>
                    <span className="review-value">••••••••</span>
                  </div>
                </div>
                
                <div className="security-notice">
                  <span><AlertCircleIcon /> <strong>Security Notice:</strong> Passwords are hidden for security.</span>
                  <span>This application does not store data on a server or in local cookies. Check the browser console on submission to see the final payload.</span>
                </div>
              </div>
            )}

            {/* Navigation Actions */}
            <div className="actions">
              {currentStep > 1 && (
                <button type="button" className="btn btn-secondary" onClick={handleBack}>
                  Back
                </button>
              )}
              
              {currentStep < 3 ? (
                <button 
                  type="button" 
                  className="btn btn-primary" 
                  onClick={handleNext}
                  disabled={!isStepValid()}
                >
                  Next Step
                </button>
              ) : (
                <button type="submit" className="btn btn-primary">
                  Confirm & Submit
                </button>
              )}
            </div>

          </form>
        </div>
      );
    };

    const container = document.getElementById('root');
    const root = createRoot(container);
    root.render(<WizardApp />);
  </script>
</body>
</html>
